name: Build and record Android TV demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emulator-demo.yml'
      - 'tools/capture_cloud_demo.py'
      - 'tools/capture_connected_demo.py'
      - 'packaged_demo.py'
      - 'pipeline_service.py'
      - 'fireos/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference dependencies
        run: python -m pip install numpy cryptography
      - name: Install headless media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build app and run Kotlin tests
        working-directory: fireos
        run: bash gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record real native playback and controlled failures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1920x1080
          script: |
            adb install -r fireos/app/build/outputs/apk/debug/app-debug.apk
            python tools/capture_cloud_demo.py --serial emulator-5554
            python tools/capture_connected_demo.py --serial emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FireShield-native-demo-${{ github.sha }}
          retention-days: 7
          path: |
            evidence/cloud-demo/
            evidence/connected-native/
            fireos/app/build/outputs/apk/debug/app-debug.apk
            fireos/app/build/reports/tests/
